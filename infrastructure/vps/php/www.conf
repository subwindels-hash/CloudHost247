; CloudHost247 — PHP-FPM pool for WHMCS 8.x on Ubuntu 24.04 VPS.
; Installed to /etc/php/8.2/fpm/pool.d/www.conf by setup-ubuntu-24.04.sh.
; PHP 8.2 ONLY: WHMCS 8.x does not support PHP 8.3+. Do not switch pools.

[www]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Dynamic process manager: scales with traffic, caps memory on small VPS.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; WHMCS cron + invoice runs can be long; keep the FPM timeout generous.
request_terminate_timeout = 300s

; Slow log for diagnosing WHMCS timeouts (enable by uncommenting).
; slowlog = /var/log/php8.2-fpm-slow.log
; request_slowlog_timeout = 10s

; Private storage outside the web root for WHMCS Module Manager & Digital Products.
env[CH247_MODULE_STORAGE] = /var/lib/cloudhost247

; Security: never expose phpinfo, disable dangerous functions for WHMCS.
php_admin_flag[expose_php] = Off
php_admin_flag[display_errors] = Off
php_admin_flag[log_errors] = On
php_admin_value[error_log] = /var/log/php8.2-fpm-www.log
php_admin_value[open_basedir] = /var/www/whmcs/:/var/lib/cloudhost247/:/tmp/:/var/tmp/
php_admin_value[disable_functions] = passthru,shell_exec,system,proc_open,popen
