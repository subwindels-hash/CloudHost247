; CloudHost247 — PHP 8.2 ini overrides for WHMCS 8.x on Ubuntu 24.04 VPS.
; Installed to /etc/php/8.2/fpm/conf.d/ and /etc/php/8.2/cli/conf.d/.

; WHMCS requires generous upload + memory limits (order-form uploads,
; module imports, email attachments). Mirrors Nginx client_max_body_size 64m.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Timezone (WHMCS invoices/cron). Change to your business timezone.
date.timezone = UTC

; Session hardening for WHMCS client/admin sessions.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.gc_maxlifetime = 1440

; ionCube Loader is enabled via 00-ioncube-loader.ini (setup script).
; Verify with: php -m | grep -i ioncube

; Performance: OPcache for WHMCS templates/modules.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
