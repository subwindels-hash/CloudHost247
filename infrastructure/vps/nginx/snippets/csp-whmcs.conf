# CloudHost247 — Nginx CSP for the WHMCS front-end only.
#
# Applied to the WHMCS vhost (NOT the Node vhost: the SPA sends its own CSP).
# Allows the payment gateways and CDNs WHMCS order forms and addons load.
#
# Nginx gotcha: `add_header` directives are inherited from the outer block ONLY
# if the inner block declares none. Any location that sets its own add_header
# (e.g. immutable static assets) must re-include this file and
# snippets/security-headers.conf, or it silently loses these headers.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://www.paypal.com https://www.paypalobjects.com https://js.paystack.co https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https://js.stripe.com https://www.paypal.com https://checkout.paystack.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://www.paypal.com https://checkout.stripe.com" always;
