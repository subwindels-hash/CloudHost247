# CloudHost247 — shared Nginx security headers (included by both vhosts).
#
# Deliberately does NOT set Content-Security-Policy: the Node SPA emits its own
# CSP from Fastify (src/plugins/security.ts), and a second CSP header would be
# enforced as an intersection, breaking the app. The WHMCS vhost includes
# snippets/csp-whmcs.conf separately.
#
# Keep in sync with the HTTP Security Headers Generator tool output
# (config/tools.php → http_security_headers) so the live site matches the tool.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS is only sent over HTTPS (the HTTP→HTTPS redirect vhosts do not include
# this snippet). 1 year + includeSubDomains; preload intentionally omitted.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
