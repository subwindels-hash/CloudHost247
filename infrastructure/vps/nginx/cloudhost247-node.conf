# CloudHost247 — Node platform vhost (Nginx reverse proxy → systemd Node :3000).
#
# The Node app (cloudhost247-node/) is a Fastify server that binds 0.0.0.0:$PORT
# (default 3000) and sets trustProxy: true, so it runs unchanged behind this
# proxy. On cPanel the same proxy role is played by Apache + Passenger; here
# Nginx + systemd replace it (no Passenger, no Application Manager).
#
# Install: setup-ubuntu-24.04.sh renders __APP_DOMAIN__ and symlinks this file
# into /etc/nginx/sites-enabled/. Certificates (webroot plugin — it writes the
# certificate files only and does not rewrite this vhost):
#   certbot certonly --webroot -w /var/www/letsencrypt -d __APP_DOMAIN__

# --- HTTP → HTTPS redirect -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __APP_DOMAIN__;

    # Certbot HTTP-01 challenge must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Node platform (HTTPS) -------------------------------------------------
server {
    # Ubuntu 24.04 ships Nginx 1.24 (HTTP/2 is a listen flag, not `http2 on;`).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __APP_DOMAIN__;

    # Certbot fills these in; placeholders keep `nginx -t` green pre-cert.
    ssl_certificate     /etc/letsencrypt/live/__APP_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__APP_DOMAIN__/privkey.pem;
    # OCSP stapling needs the intermediate chain explicitly.
    ssl_trusted_certificate /etc/letsencrypt/live/__APP_DOMAIN__/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/security-headers.conf;

    # API payloads + file uploads (deployment manifests, backups).
    client_max_body_size 64m;

    # Reverse proxy to the systemd-managed Node process (127.0.0.1:3000).
    # The app reads X-Forwarded-* (trustProxy: true) for client IPs, HTTPS
    # detection, and webhook signature verification.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # SPA fallback is handled inside the app (Fastify static + 404 → index.html).
        # Note: the SPA's CSP comes from Fastify (src/plugins/security.ts), so the
        # edge only adds the shared headers from snippets/security-headers.conf.
    }

    # Health endpoints must never be cached or rate-limited at the edge.
    # (These blocks redeclare add_header, so they re-include the security
    # headers — Nginx otherwise drops every inherited add_header.)
    location = /health {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    location = /ready {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    access_log /var/log/nginx/cloudhost247-node.access.log;
    error_log  /var/log/nginx/cloudhost247-node.error.log;
}
