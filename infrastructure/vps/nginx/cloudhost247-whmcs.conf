# CloudHost247 — WHMCS 8.x vhost (Nginx + PHP 8.2-FPM) on Ubuntu 24.04 VPS.
#
# Install: setup-ubuntu-24.04.sh renders __DOMAIN__ and symlinks this file into
# /etc/nginx/sites-enabled/.
#
# TLS IS EXPECTED TO BE ISSUED SEPARATELY, and the order matters on a fresh VPS:
#   a) This 443 block references /etc/letsencrypt/live/__DOMAIN__/ files that do
#      not exist yet, so `nginx -t` fails. The setup script therefore installs a
#      throwaway self-signed certificate at that path (bootstrap_selfsigned() )
#      so the config is valid and Certbot's HTTP-01 challenge can be served.
#   b) Certbot issues the real certificate with the WEBROOT plugin and only
#      writes the certificate files in place — it does NOT edit this vhost
#      (the `--nginx` plugin would rewrite the hand-tuned config segments):
#
#        certbot certonly --webroot -w /var/www/letsencrypt \
#          -d __DOMAIN__ -d www.__DOMAIN__
#
#      The HTTP block already serves /.well-known/acme-challenge/ from that
#      webroot, so the challenge succeeds before TLS exists.
#
# WHMCS pretty-URL note: WHMCS ships Apache .htaccess rules that rewrite every
# non-file request to index.php. The `try_files` below is the Nginx equivalent.
# The /tools/ location mirrors tools/.htaccess (front-controller, data denied).

# --- HTTP: ACME challenge + HTTPS redirect ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Certbot HTTP-01 challenge must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- WHMCS (HTTPS) ---------------------------------------------------------
server {
    # Ubuntu 24.04 ships Nginx 1.24, where HTTP/2 is enabled on the listen
    # directive (`http2 on;` only exists in 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/whmcs;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    # OCSP stapling needs the intermediate chain explicitly.
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-whmcs.conf;

    # WHMCS upload limits (mirrors php/zz-cloudhost247.ini).
    client_max_body_size 64m;

    # Gzip for text assets (WHMCS templates, CSS/JS, JSON).
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Deny dotfiles (includes .htaccess, .env, .git) and WHMCS internals.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    # attachments/downloads are served through WHMCS download.php, never direct.
    # `install/` is deliberately NOT denied: the WHMCS web installer has to be
    # reachable at /install/ during §5 of the runbook. Delete that directory
    # immediately afterwards (`rm -rf ${WHMCS_ROOT}/install`) — the healthcheck
    # and go-live checklist both require its absence.
    location ~ ^/(templates_c|attachments|downloads)/ {
        deny all;
    }
    # WHMCS config holds DB credentials + licence key: never served as text.
    location = /configuration.php {
        deny all;
    }

    # PHP-FPM (WHMCS). PHP 8.2 only — WHMCS 8.x does not support PHP 8.3+.
    # Declared before `location /` so it wins for .php requests.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # /tools/ front-controller (tools/.htaccess equivalent).
    # The data directory is denied with `^~` so it beats every regex location.
    # /tools/ itself is a PLAIN prefix (no `^~`): its try_files sends requests to
    # /tools/index.php, and `^~` would outrank the `\.php$` regex location and
    # loop (500). Plain prefix loses to regex, so PHP-FPM handles the redirect.
    location ^~ /tools/data/ {
        deny all;
    }
    location /tools/ {
        try_files $uri $uri/ /tools/index.php?$query_string;
    }

    # Static asset caching (WHMCS theme + order-form assets).
    # Re-includes the header snippets: a nested add_header here would otherwise
    # drop every inherited security header (see snippets/csp-whmcs.conf note).
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-whmcs.conf;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # WHMCS pretty URLs: every non-file request → index.php (Apache .htaccess equivalent).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    access_log /var/log/nginx/cloudhost247-whmcs.access.log;
    error_log  /var/log/nginx/cloudhost247-whmcs.error.log;
}
