# CloudHost247 platform infrastructure — self-hosted stack (staging/production).
#
# Runs the control plane (API + portal), the deployment worker, PostgreSQL, Redis, and Traefik
# on one or more Docker hosts. The PHP marketing site and cPanel deployment story are separate
# (docs/CPANEL_DEPLOYMENT.md); this compose is for the Docker/VPS deployment of the platform
# itself.
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d
#   docker compose exec -e CONFIRM_MIGRATION=yes app npm run migrate   # explicit, controlled migrations
#   docker compose exec app node dist/src/scripts-import-manifests.js   # or POST /api/v1/admin/manifests/import
#
# Keep this shared map on both app and worker. The app validates providers and resolves customer
# choices; the worker performs the provider calls. Blank optional values fail closed in the adapter.
x-provider-environment: &provider-environment
  ALLOW_MOCK_PROVIDER: 'false'
  APP_URL: ${APP_URL:?set APP_URL}
  PROVISIONING_HEALTH_TIMEOUT_MS: '${PROVISIONING_HEALTH_TIMEOUT_MS:-600000}'
  SERVER_AGENT_INSTALL_URL: ${SERVER_AGENT_INSTALL_URL:-}
  NOTIFICATION_EMAIL_WEBHOOK_URL: ${NOTIFICATION_EMAIL_WEBHOOK_URL:-}
  NOTIFICATION_EMAIL_WEBHOOK_TOKEN: ${NOTIFICATION_EMAIL_WEBHOOK_TOKEN:-}
  HETZNER_API_URL: ${HETZNER_API_URL:-https://api.hetzner.cloud/v1}
  HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
  DIGITALOCEAN_API_URL: ${DIGITALOCEAN_API_URL:-https://api.digitalocean.com/v2}
  DIGITALOCEAN_API_TOKEN: ${DIGITALOCEAN_API_TOKEN:-}
  VULTR_API_URL: ${VULTR_API_URL:-https://api.vultr.com/v2}
  VULTR_API_KEY: ${VULTR_API_KEY:-}
  # Native AWS EC2 and Contabo Compute credentials. Keep them in the deployment secret store;
  # the same values must reach both app and worker because the worker calls providers.
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  CONTABO_API_URL: ${CONTABO_API_URL:-https://api.contabo.com/v1}
  CONTABO_TOKEN_URL: ${CONTABO_TOKEN_URL:-https://auth.contabo.com/auth/realms/contabo/protocol/openid-connect/token}
  CONTABO_CLIENT_ID: ${CONTABO_CLIENT_ID:-}
  CONTABO_CLIENT_SECRET: ${CONTABO_CLIENT_SECRET:-}
  CONTABO_API_USER: ${CONTABO_API_USER:-}
  CONTABO_API_PASSWORD: ${CONTABO_API_PASSWORD:-}
  OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY:-}
  OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET:-}
  OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:-}
  OVH_CLOUD_PROJECT_ID: ${OVH_CLOUD_PROJECT_ID:-}
  OVH_API_ENDPOINT: ${OVH_API_ENDPOINT:-}
  PROXMOX_API_TOKEN: ${PROXMOX_API_TOKEN:-}
  PROXMOX_API_URL: ${PROXMOX_API_URL:-}
  VIRTUALIZOR_API_KEY: ${VIRTUALIZOR_API_KEY:-}
  VIRTUALIZOR_API_SECRET: ${VIRTUALIZOR_API_SECRET:-}
  VIRTUALIZOR_API_URL: ${VIRTUALIZOR_API_URL:-}
  SOLUSVM_API_ID: ${SOLUSVM_API_ID:-}
  SOLUSVM_API_KEY: ${SOLUSVM_API_KEY:-}
  SOLUSVM_API_URL: ${SOLUSVM_API_URL:-}
  OPENSTACK_AUTH_URL: ${OPENSTACK_AUTH_URL:-}
  OPENSTACK_USERNAME: ${OPENSTACK_USERNAME:-}
  OPENSTACK_PASSWORD: ${OPENSTACK_PASSWORD:-}
  OPENSTACK_PROJECT_ID: ${OPENSTACK_PROJECT_ID:-}
  OPENSTACK_PROJECT_NAME: ${OPENSTACK_PROJECT_NAME:-}
  OPENSTACK_USER_DOMAIN_NAME: ${OPENSTACK_USER_DOMAIN_NAME:-Default}
  OPENSTACK_PROJECT_DOMAIN_NAME: ${OPENSTACK_PROJECT_DOMAIN_NAME:-Default}
  OPENSTACK_REGION: ${OPENSTACK_REGION:-}
  OPENSTACK_API_URL: ${OPENSTACK_API_URL:-}
  OPENSTACK_IMAGE_URL: ${OPENSTACK_IMAGE_URL:-}
  OPENSTACK_API_TOKEN: ${OPENSTACK_API_TOKEN:-}
  PROVIDER_BRIDGE_API_TOKEN: ${PROVIDER_BRIDGE_API_TOKEN:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudhost247}
      POSTGRES_USER: ${POSTGRES_USER:-cloudhost247}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cloudhost247}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks: [internal]

  app:
    build:
      # The Dockerfile copies both the Node control plane and the infrastructure files, so the
      # repository root (not cloudhost247-node/) must be the build context.
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *provider-environment
      NODE_ENV: production
      APP_URL: ${APP_URL:?set APP_URL}
      DATABASE_URL: postgres://${POSTGRES_USER:-cloudhost247}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cloudhost247}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
      DEPLOYMENT_SIMULATION_MODE: 'false'
      KUBERNETES_ADAPTER_ENABLED: 'false'
      LOG_LEVEL: info
    volumes:
      - manifests:/app/manifests:ro
    networks: [internal, traefik]
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.ch247-app.rule=Host(`${APP_HOST:?set APP_HOST}`)'
      - 'traefik.http.routers.ch247-app.entrypoints=websecure'
      - 'traefik.http.routers.ch247-app.tls=true'
      - 'traefik.http.routers.ch247-app.tls.certresolver=letsencrypt'
      - 'traefik.http.services.ch247-app.loadbalancer.server.port=3000'

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ['node', 'dist/src/worker/main.js']
    environment:
      <<: *provider-environment
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-cloudhost247}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cloudhost247}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
      WORKER_ID: ${WORKER_ID:-worker-1}
      WORKER_POLL_INTERVAL_MS: '${WORKER_POLL_INTERVAL_MS:-2000}'
      WORKER_CONCURRENCY: '${WORKER_CONCURRENCY:-4}'
      WORKER_LEASE_MS: '${WORKER_LEASE_MS:-120000}'
    volumes:
      - manifests:/app/manifests:ro
    networks: [internal]

  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.network=cloudhost247-traefik'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--certificatesresolvers.letsencrypt.acme.tlschallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      - '--metrics.prometheus=true'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [traefik]

volumes:
  postgres-data:
  redis-data:
  letsencrypt:
  manifests:

networks:
  internal: {}
  # Customer deployment manifests use this stable external name for Traefik labels. Without an
  # explicit name Compose would create cloudhost247_traefik, which would not match the generated
  # cloudhost247-traefik network and routes would silently fail.
  traefik:
    name: cloudhost247-traefik
