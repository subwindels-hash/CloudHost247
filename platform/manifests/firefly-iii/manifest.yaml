id: firefly-iii
name: Firefly III
category: finance
description: A free and open-source personal finance manager with budgets and reports.
website: https://firefly-iii.org
repository: https://github.com/firefly-iii/firefly-iii
documentation: https://docs.firefly-iii.org
license: AGPL-3.0
featured: false
popularity: 520
deployment:
  engine: docker-compose
supportedHostingTypes:
- docker
- vps
- dedicated
requirements:
  cpu: 1
  memory: 1024
  storage: 10240
  recommended:
    cpu: 1
    memory: 2048
    storage: 20480
services:
  app:
    image: fireflyiii/core
    internal: false
    port: 8080
    volumes:
    - /var/www/html/storage/upload
    dependsOn:
    - db
  db:
    image: mariadb:11
    internal: true
    volumes:
    - /var/lib/mysql
    database: mariadb
environment:
  required:
  - key: APP_KEY
    description: Laravel application key (base64:...)
    secret: true
    generate: random_32
  optional:
  - key: APP_URL
    defaultFromUrl: true
domain:
  enabled: true
  primaryRequired: false
healthcheck:
  type: http
  path: /health
  port: 8080
ssl:
  enabled: true
backup:
  enabled: true
  includes:
  - volumes
  - database
update:
  strategy: pull-and-recreate
versions:
- version: 6.1.24
  image: fireflyiii/core:version-6.1.24
  stable: true
