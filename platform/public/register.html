<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — CloudHost247</title>
  <meta name="description" content="Create your free CloudHost247 account." />
  <meta name="theme-color" content="#0756d8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">
        <img src="/icons/icon-192.png" alt="" width="32" height="32" /> CloudHost247
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="main-nav">
        <span class="sr-only">Toggle navigation</span> ☰
      </button>
      <nav class="nav" id="main-nav" data-nav aria-label="Primary">
        <a href="/">Home</a>
        <a href="/web-hosting.html">Web Hosting</a>
        <a href="/vps-hosting.html">VPS</a>
        <a href="/domains.html">Domains</a>
        <span data-auth-slot></span>
      </nav>
    </div>
  </header>

  <main id="main" class="section">
    <div class="container">
      <form class="form-card" data-register-form novalidate>
        <h1 style="font-size:1.6rem">Create your account</h1>
        <p class="muted">A permanent customer ID is assigned automatically.</p>

        <div class="form-alert" data-form-alert role="alert"></div>

        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="phone">Phone <span class="muted">(optional)</span></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required />
          <p class="hint">At least 12 characters. Longer is better.</p>
        </div>

        <div class="field">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirmPassword" type="password" autocomplete="new-password" required />
        </div>

        <input type="hidden" name="plan" data-plan-field />

        <button class="btn btn-primary" type="submit" style="width:100%">Create account</button>

        <p class="text-center" style="margin-top:16px;margin-bottom:0">
          Already registered? <a href="/login.html">Sign in</a>
        </p>
      </form>
    </div>
  </main>

  <script type="module" src="/assets/js/site.js"></script>
  <script type="module" src="/assets/js/auth-forms.js"></script>
</body>
</html>
