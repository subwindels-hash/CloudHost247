<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — CloudHost247</title>
  <meta name="description" content="Sign in to your CloudHost247 account." />
  <meta name="theme-color" content="#0756d8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">
        <img src="/icons/icon-192.png" alt="" width="32" height="32" /> CloudHost247
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="main-nav">
        <span class="sr-only">Toggle navigation</span> ☰
      </button>
      <nav class="nav" id="main-nav" data-nav aria-label="Primary">
        <a href="/">Home</a>
        <a href="/web-hosting.html">Web Hosting</a>
        <a href="/vps-hosting.html">VPS</a>
        <a href="/domains.html">Domains</a>
        <span data-auth-slot></span>
      </nav>
    </div>
  </header>

  <main id="main" class="section">
    <div class="container">
      <form class="form-card" data-login-form novalidate>
        <h1 style="font-size:1.6rem">Sign in</h1>
        <p class="muted">Welcome back.</p>

        <div class="form-alert" data-form-alert role="alert"></div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <p class="hint"><a href="/forgot.html">Forgot your password?</a></p>
        </div>

        <div class="field" data-mfa-field hidden>
          <label for="totp">Authenticator code</label>
          <input id="totp" name="totpCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
          <p class="hint">Two-factor is enabled on this account. Enter the six-digit code from your app.</p>
        </div>

        <button class="btn btn-primary" type="submit" style="width:100%">Sign in</button>

        <div data-passkey-block hidden>
          <p class="hint" style="text-align:center;margin:16px 0 8px">or</p>
          <button class="btn btn-ghost" type="button" data-passkey-login style="width:100%">
            Sign in with a passkey
          </button>
          <p class="hint" data-passkey-hint hidden></p>
        </div>

        <p class="text-center" style="margin-top:16px;margin-bottom:0">
          No account? <a href="/register.html">Create one</a>
        </p>
      </form>
    </div>
  </main>

  <script type="module" src="/assets/js/site.js"></script>
  <script type="module" src="/assets/js/auth-forms.js"></script>
</body>
</html>
