<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — CloudHost247</title>
  <meta name="theme-color" content="#0756d8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/"><img src="/icons/icon-192.png" alt="" width="32" height="32" /> CloudHost247</a>
    </div>
  </header>

  <main id="main" class="section">
    <div class="container">
      <form class="form-card" data-forgot-form novalidate>
        <h1 style="font-size:1.6rem">Reset your password</h1>
        <p class="muted">Enter the email on your account and we will send a reset link.</p>

        <div class="form-alert" data-form-alert role="status"></div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <button class="btn btn-primary" type="submit" style="width:100%">Send reset link</button>
        <p class="text-center" style="margin-top:16px;margin-bottom:0"><a href="/login.html">Back to sign in</a></p>
      </form>
    </div>
  </main>

  <script type="module" src="/assets/js/site.js"></script>
  <script type="module" src="/assets/js/auth-forms.js"></script>
</body>
</html>
