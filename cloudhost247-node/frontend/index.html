<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Static document shell.

      This is what a crawler that does not execute JavaScript sees, and what a visitor sees for the
      few milliseconds before the bundle boots, so it carries real CloudHost247 metadata rather than
      a placeholder line. Per-route metadata (title, description, canonical, Open Graph, JSON-LD) is
      applied by `usePageMeta` once a route mounts, and the server-rendered `/sitemap.xml` plus the
      navigation registry are what make each public route discoverable without depending on
      JavaScript at all.

      The values below must stay consistent with `BRAND` in shared/site/registry.json.
    -->
    <title>CloudHost247 — Global Cloud Hosting &amp; Digital Infrastructure</title>
    <meta
      name="description"
      content="CloudHost247 gives businesses, developers and organizations worldwide the infrastructure they need to build and operate online — from domains and websites to cloud servers, applications and deployment platforms."
    />
    <meta name="theme-color" content="#0a1620" />
    <meta name="color-scheme" content="light" />

    <link rel="canonical" href="/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CloudHost247" />
    <meta property="og:title" content="CloudHost247 — Global Cloud Hosting &amp; Digital Infrastructure" />
    <meta
      property="og:description"
      content="Domains, hosting, cloud servers, applications and developer tooling in one account, with live catalogue pricing."
    />
    <meta property="og:image" content="/media/cloudhost247/social/cloudhost247-social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/media/cloudhost247/social/cloudhost247-social.png" />

    <link rel="icon" href="/media/cloudhost247/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/media/cloudhost247/brand/icon-mark.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/media/cloudhost247/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/media/cloudhost247/favicon/site.webmanifest" />

    <style>
      /* Inline so the startup screen is styled even before the application bundle loads. */
      .startup { box-sizing: border-box; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px; color: #e9eef3; background: radial-gradient(ellipse at 50% 25%, #263a43 0%, #111d26 42%, #080e14 100%); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .startup *, .startup *::before, .startup *::after { box-sizing: border-box; }
      .startup__card { width: min(100%, 480px); padding: clamp(32px, 7vw, 52px) 28px 30px; text-align: center; border: 1px solid rgba(209, 224, 227, .16); border-radius: 24px; background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025)); box-shadow: 0 28px 80px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.09); }
      .startup__brand { margin: 0; color: #d9e5e4; font-size: .72rem; font-weight: 750; letter-spacing: .2em; text-transform: uppercase; }
      .startup__scene { position: relative; width: 170px; height: 170px; margin: 20px auto 22px; display: grid; place-items: center; perspective: 600px; }
      .startup__scene::after { content: ""; position: absolute; bottom: 7px; width: 105px; height: 20px; border-radius: 50%; background: rgba(82, 226, 199, .2); filter: blur(14px); }
      .startup__orbit { position: absolute; width: 148px; height: 148px; border: 1px solid rgba(136, 226, 213, .38); border-radius: 50%; transform: rotateX(68deg) rotateZ(-20deg); box-shadow: 0 0 20px rgba(90, 224, 200, .11), inset 0 0 20px rgba(90, 224, 200, .08); animation: startup-orbit 4s linear infinite; }
      .startup__orbit::after { content: ""; position: absolute; left: 50%; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #b5fff0; box-shadow: 0 0 14px #6be5cf; }
      .startup__orbit--second { width: 122px; height: 122px; border-color: rgba(220, 232, 235, .25); animation-direction: reverse; animation-duration: 5.5s; }
      .startup__core { position: relative; z-index: 1; width: 78px; height: 78px; display: grid; place-items: center; border: 1px solid rgba(194, 255, 243, .38); border-radius: 22px; background: linear-gradient(145deg, #4d7b79, #1a3439 58%, #0d2028); box-shadow: inset 0 1px 1px rgba(255,255,255,.35), 0 18px 32px rgba(0,0,0,.38), 0 0 32px rgba(96, 219, 198, .18); transform: rotate(-10deg); animation: startup-float 3s ease-in-out infinite; }
      .startup__core img { width: 42px; height: 42px; object-fit: contain; }
      .startup h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 1.8rem); line-height: 1.25; letter-spacing: -.035em; }
      .startup__subtitle { margin: 10px 0 0; color: #b5c5c9; font-size: .94rem; line-height: 1.6; }
      .startup__indicator { display: flex; justify-content: center; gap: 6px; margin: 23px 0; }
      .startup__indicator span { width: 6px; height: 6px; border-radius: 50%; background: #8ce7d6; animation: startup-pulse 1.2s ease-in-out infinite; }
      .startup__indicator span:nth-child(2) { animation-delay: .15s; } .startup__indicator span:nth-child(3) { animation-delay: .3s; }
      .startup__help { margin: 0; padding-top: 22px; border-top: 1px solid rgba(222,235,236,.12); color: #aab9bd; font-size: .8rem; line-height: 1.6; }
      .startup__help a { color: #b4eee2; text-underline-offset: 3px; } .startup__help a:focus-visible { outline: 2px solid #b4eee2; outline-offset: 4px; }
      @keyframes startup-orbit { to { transform: rotateX(68deg) rotateZ(340deg); } }
      @keyframes startup-float { 50% { transform: translateY(-7px) rotate(-5deg); } }
      @keyframes startup-pulse { 0%, 80%, 100% { opacity: .35; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.15); } }
      @media (prefers-reduced-motion: reduce) { .startup__orbit, .startup__core, .startup__indicator span { animation: none; } }
      body:has(.startup) { margin: 0; }
    </style>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CloudHost247 Isc.",
        "alternateName": "CloudHost247",
        "slogan": "Build. Host. Deploy. Scale.",
        "description": "Hosting, cloud, domains, infrastructure, developer platforms and digital services."
      }
    </script>
  </head>
  <body>
    <div id="root">
      <main class="startup">
        <div class="startup__card">
          <p class="startup__brand">CloudHost247</p>
          <div class="startup__scene" aria-hidden="true">
            <div class="startup__orbit"></div>
            <div class="startup__orbit startup__orbit--second"></div>
            <div class="startup__core"><img src="/media/cloudhost247/brand/icon-mark.svg" alt="" /></div>
          </div>
          <div role="status" aria-live="polite">
            <h1>Loading CloudHost247…</h1>
            <p class="startup__subtitle">Getting everything ready for you.</p>
          </div>
          <div class="startup__indicator" aria-hidden="true"><span></span><span></span><span></span></div>
          <p class="startup__help">If the page doesn’t appear, check your connection and <a href="">refresh the page</a>.</p>
        </div>
      </main>
    </div>
    <noscript>
      <p>
        CloudHost247 needs JavaScript for the interactive parts of this site — the client area,
        the product catalogue and the online tools. The pages themselves, the
        <a href="/sitemap">sitemap</a>, the <a href="/legal">legal &amp; policy center</a> and the
        <a href="/docs">documentation</a> are all browsable without it.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
