id: espocrm
name: EspoCRM
category: crm
description: Open-source CRM with a clean interface, workflows, and full data ownership.
website: https://espocrm.com
repository: https://github.com/espocrm/espocrm
documentation: https://docs.espocrm.com
license: AGPL-3.0
featured: false
popularity: 430
deployment:
  engine: docker-compose
supportedHostingTypes:
- docker
- vps
- dedicated
requirements:
  cpu: 1
  memory: 1024
  storage: 20480
  recommended:
    cpu: 2
    memory: 2048
    storage: 40960
services:
  app:
    image: espocrm/espocrm
    internal: false
    port: 8080
    volumes:
    - /var/www/html
    dependsOn:
    - db
  db:
    image: mariadb:11
    internal: true
    volumes:
    - /var/lib/mysql
    database: mariadb
environment:
  required: []
  optional: []
domain:
  enabled: true
  primaryRequired: false
healthcheck:
  type: http
  path: /api/v1/App/user
  port: 8080
ssl:
  enabled: true
backup:
  enabled: true
  includes:
  - volumes
  - database
update:
  strategy: pull-and-recreate
versions:
- version: '9.0'
  image: espocrm/espocrm:9.0-apache
  stable: true
