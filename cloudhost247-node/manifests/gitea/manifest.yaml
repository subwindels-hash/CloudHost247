id: gitea
name: Gitea
category: developer-tools
description: Painless self-hosted Git service with issues, pull requests, and built-in CI.
website: https://gitea.com
repository: https://github.com/go-gitea/gitea
documentation: https://docs.gitea.com
license: MIT
featured: true
popularity: 830
deployment:
  engine: docker-compose
supportedHostingTypes:
- docker
- vps
- dedicated
- kubernetes
requirements:
  cpu: 1
  memory: 1024
  storage: 20480
  recommended:
    cpu: 2
    memory: 2048
    storage: 102400
services:
  app:
    image: gitea/gitea
    internal: false
    port: 3000
    volumes:
    - /data
    dependsOn:
    - db
  db:
    image: postgres:17-alpine
    internal: true
    volumes:
    - /var/lib/postgresql/data
    database: postgres
environment:
  required: []
  optional:
  - key: GITEA__server__ROOT_URL
    defaultFromUrl: true
  - key: GITEA__server__DOMAIN
    defaultFromDomain: true
domain:
  enabled: true
  primaryRequired: false
healthcheck:
  type: http
  path: /api/healthz
  port: 3000
ssl:
  enabled: true
backup:
  enabled: true
  includes:
  - volumes
  - database
update:
  strategy: pull-and-recreate
versions:
- version: 1.24.0
  image: gitea/gitea:1.24.0
  stable: true
