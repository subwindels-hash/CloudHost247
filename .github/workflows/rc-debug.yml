name: RC debug (temporary)
on:
  push:
    branches: [arena/01a0e7b6-cloudhost247]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  rc-debug:
    name: RC debug (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Run the release-candidate script repeatedly and report failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          report="/tmp/report.md"
          echo "PHP ${{ matrix.php }} — release-candidate-check.sh x5" > "$report"
          worst=0
          for i in 1 2 3 4 5; do
            bash scripts/release-candidate-check.sh > "/tmp/rc-$i.log" 2>&1
            code=$?
            echo "run $i exit=$code" >> "$report"
            if [ "$code" != "0" ]; then
              worst=$code
              {
                echo ''
                echo "failing run $i tail:"
                echo '```'
                tail -n 40 "/tmp/rc-$i.log"
                echo '```'
              } >> "$report"
            fi
          done
          cat "$report"
          gh api "repos/${GITHUB_REPOSITORY}/issues/10/comments" -f body="$(cat "$report")" >/dev/null || true
          exit 0
