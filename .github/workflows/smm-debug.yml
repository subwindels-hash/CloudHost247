name: SMM debug
on:
  push:
    branches: [arena/01a0e748-cloudhost247]
permissions:
  issues: write
  pull-requests: write
jobs:
  smm-debug:
    name: SMM behavior diagnostics report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Run SMM behavior suite and report output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          php -d display_errors=1 -d error_reporting=E_ALL tests/smm/run.php > /tmp/smm.out 2>&1
          RC=$?
          set -e
          echo "exit_code=$RC" >> /tmp/smm.out
          cat /tmp/smm.out
          if [ "$RC" -ne 0 ]; then
            export SMM_RC="$RC"
            python3 /dev/stdin <<'PYEOF'
          import json, os, urllib.request
          body = "SMM behavior suite failed (exit %s). Output:\n```\n%s\n```" % (
              os.environ.get("SMM_RC", "?"), open("/tmp/smm.out").read())
          req = urllib.request.Request(
              "https://api.github.com/repos/%s/issues/7/comments" % os.environ["GITHUB_REPOSITORY"],
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": "token " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"})
          try:
              urllib.request.urlopen(req)
              print("debug comment posted")
          except Exception as e:
              print("comment failed:", e)
          PYEOF
          fi
          exit $RC
