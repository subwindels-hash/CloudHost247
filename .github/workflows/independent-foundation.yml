name: Independent foundation
# Run on every push and pull request. Do not pin this to short-lived Arena branches: a merge to
# main must receive the same PHP/module verification as its pull request.
on:
  push:
  pull_request:
jobs:
  release-candidate:
    name: Release candidate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax diagnostics
        run: find modules/addons/cloudhost247_* modules/addons/phoneservices modules/addons/customaffiliate modules/servers/cloudhost247_email_hosting modules/servers/phoneservices_numbers modules/servers/phoneservices_voip modules/servers/phoneservices_sms modules/servers/phoneservices_esim modules/servers/cloudhost247_ovh modules/servers/cloudhost247_smm modules/servers/RDP tests scripts crons/cloudhost247_*.php builder-page.php cloudhost247-page.php aboutus.php all-element-cloudhost247.php blog.php cloudhost247-sample.php cloudhost247-vps-sample.php comingsoon.php cpanel-hosting.php data-protection-standards.php dedeicated-server.php dedicated-server.php developer-friendly.php domain.php email-hosting.php enterprise-servers.php future-element.php game-servers.php help-center.php legal-notice.php notfound.php offers.php plesk-hosting.php refund-and-cancellation-policy.php refund-policy.php ssl-certificate.php tables.php terms-of-service.php vps-hosting.php vps-privatecloud.php vps-publiccloud.php web-hosting.php website-design.php windows-hosting.php wordpress-hosting.php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Phone Services PHP template diagnostics
        run: find modules/addons/phoneservices/templates/admin modules/addons/phoneservices/templates/client modules/addons/customaffiliate/templates/admin modules/addons/cloudhost247_cart_recovery/templates/admin modules/addons/cloudhost247_passkey/templates/admin -name '*.tpl' -print0 | xargs -0 -n1 php -l
      - name: PHP behavior diagnostics
        run: php tests/foundation/run.php && php -d display_errors=1 tests/theme/run.php && php tests/currency/run.php && php -d display_errors=1 tests/ovh/run.php && php -d display_errors=1 tests/rdp/run.php && php -d display_errors=1 tests/integrations/run.php && php -d display_errors=1 tests/modules/run.php && php -d display_errors=1 tests/builder/run.php && php -d display_errors=1 tests/smm/run.php && php -d display_errors=1 tests/tools/run.php && php -d display_errors=1 tests/broker/run.php && php -d display_errors=1 tests/marketing/run.php && php -d display_errors=1 tests/cart_recovery/run.php && php -d display_errors=1 tests/passkey/run.php && php -d display_errors=1 tests/phoneservices/run.php && php -d display_errors=1 tests/customaffiliate/run.php && php -d display_errors=1 tests/cloudhost247_email/run.php
      - name: Retired-brand audit (repository-wide)
        run: python3 scripts/branding-audit.py
      - name: Complete release-candidate verification
        run: bash scripts/release-candidate-check.sh
