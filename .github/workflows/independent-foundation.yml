name: Independent foundation
# Run on every push and pull request. Do not pin this to short-lived Arena branches: a merge to
# main must receive the same PHP/module verification as its pull request.
on:
  push:
  pull_request:
jobs:
  release-candidate:
    name: Release candidate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          # The server agent's authentication suite (server-agent/tests/) and the protocol
          # conformance suite need Node. The agent declares "engines": { "node": ">=20.0.0" }.
          node-version: '20'
      - name: PHP syntax diagnostics (every PHP file this repository owns)
        # pipefail so a php -l failure cannot hide behind a successful xargs
        run: set -o pipefail; bash scripts/php-lint-targets.sh | xargs -r -n1 php -l
      - name: PHP behavior diagnostics
        run: |
          for suite in foundation theme currency ovh rdp integrations modules builder smm tools broker marketing cart_recovery passkey phoneservices customaffiliate cloudhost247_email payments; do
            echo "::group::$suite"
            if php -d display_errors=1 "tests/$suite/run.php" > "/tmp/$suite.out" 2>&1; then
              tail -3 "/tmp/$suite.out"
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "--- $suite output tail ---"
              tail -40 "/tmp/$suite.out"
              echo "::error file=tests/$suite/run.php,line=1::SUITE $suite FAILED-LINES :: $(grep -E 'not ok|FAIL|failed|Failed' "/tmp/$suite.out" | head -12 | tr '\n' '~')"
              echo "::error file=tests/$suite/run.php,line=1::SUITE $suite FAILED-CONTEXT :: $(grep -B6 -A6 -E 'not ok|FAIL' "/tmp/$suite.out" | head -40 | tr '\n' '~')"
              exit 1
            fi
          done
      - name: Retired-brand audit (repository-wide)
        run: python3 scripts/branding-audit.py
      - name: Server agent authentication (Node, no dependencies)
        run: node --test server-agent/tests/*.test.js
      - name: Complete release-candidate verification
        run: bash scripts/release-candidate-check.sh
