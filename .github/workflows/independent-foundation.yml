name: Independent rebuild tests
on:
  push:
    branches: [arena/01a0e4c2-cloudhost247]
  pull_request:
jobs:
  source-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: find modules/addons/cloudhost247_* modules/servers/cloudhost247_ovh tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHP behavior and mock tests
        run: |
          php tests/foundation/run.php
          php tests/currency/run.php
          php tests/ovh/run.php
      - name: Static and security tests
        run: python3 -m unittest -v tests/foundation/test_static.py tests/currency/test_static.py tests/ovh/test_static.py tests/security/test_security.py
