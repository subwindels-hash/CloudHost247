name: Independent foundation
# Run on every push and pull request. Do not pin this to short-lived Arena branches: a merge to
# main must receive the same PHP/module verification as its pull request.
on:
  push:
  pull_request:
jobs:
  release-candidate:
    name: Release candidate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          # The server agent's authentication suite (server-agent/tests/) and the protocol
          # conformance suite need Node. The agent declares "engines": { "node": ">=20.0.0" }.
          node-version: '22.12.0'
      - name: Build shared Tools adapter before PHP source and asset gates
        working-directory: cloudhost247-node
        run: npm ci && npm run tools:catalog:check && npm run build:tools
      - uses: actions/cache@v4
        with:
          # The pinned Smarty tarball, so the rendered-site audit below does not depend on a fresh
          # download from codeload.github.com on every run. Keyed on the digest the render script
          # verifies, so a changed pin is a changed cache entry rather than a stale library.
          path: .cache/smarty-4.5.6.tar.gz
          key: ch247-smarty-4.5.6-f617b86983b3c7115222c44d63d874630f9d4b4bd88cf1ef603b3ab138c67079
      - name: Rendered-site audit (every published page, rendered and inspected)
        # Renders all 229 published pages through the shipped Smarty components, then checks the HTML
        # a visitor and a crawler receive: heading outline, duplicate ids, one title, the AVIF/WebP
        # width ladders, every dead internal link, and the canonical address of every indexable page.
        # None of it is visible in template source, and before this step the checker was invoked by
        # nothing at all. Smarty is pinned and digest-verified by the script; it is not a repository
        # dependency (the WHMCS install supplies the real one).
        run: bash scripts/verify-rendered-site.sh --fetch
      - name: PHP syntax diagnostics (every PHP file this repository owns)
        # pipefail so a php -l failure cannot hide behind a successful xargs
        run: set -o pipefail; bash scripts/php-lint-targets.sh | xargs -r -n1 php -l
      - name: PHP behavior diagnostics
        run: php tests/foundation/run.php && php -d display_errors=1 tests/theme/run.php && php tests/currency/run.php && php -d display_errors=1 tests/ovh/run.php && php -d display_errors=1 tests/rdp/run.php && php -d display_errors=1 tests/integrations/run.php && php -d display_errors=1 tests/modules/run.php && php -d display_errors=1 tests/builder/run.php && php -d display_errors=1 tests/smm/run.php && php -d display_errors=1 tests/tools/run.php && php -d display_errors=1 tests/broker/run.php && php -d display_errors=1 tests/marketing/run.php && php -d display_errors=1 tests/cart_recovery/run.php && php -d display_errors=1 tests/passkey/run.php && php -d display_errors=1 tests/phoneservices/run.php && php -d display_errors=1 tests/customaffiliate/run.php && php -d display_errors=1 tests/cloudhost247_email/run.php && php -d display_errors=1 tests/payments/run.php
      - name: Retired-brand audit (repository-wide)
        run: python3 scripts/branding-audit.py
      - name: Server agent authentication (Node, no dependencies)
        run: node --test server-agent/tests/*.test.js
      - name: Complete release-candidate verification
        run: bash scripts/release-candidate-check.sh
