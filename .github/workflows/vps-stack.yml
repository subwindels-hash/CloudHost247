name: VPS deployment stack

# Validates the Ubuntu 24.04 VPS provisioning artefacts (Nginx vhosts, PHP-FPM
# pool, systemd units, cron/logrotate/fail2ban, install/deploy/backup/restore/
# healthcheck scripts) and, in the `deploy-path` job, actually builds and boots
# the Node app to prove a deploy produces a migrated schema and a serving
# process. The PHP/WHMCS tree is still never built here.
on:
  push:
    paths:
      - 'infrastructure/vps/**'
      - 'cloudhost247-node/scripts/package-vps.sh'
      - 'cloudhost247-node/src/**'
      - 'cloudhost247-node/database/**'
      - 'cloudhost247-node/package.json'
      - 'docs/VPS_DEPLOYMENT.md'
      - '.github/workflows/vps-stack.yml'
  pull_request:
    paths:
      - 'infrastructure/vps/**'
      - 'cloudhost247-node/scripts/package-vps.sh'
      - 'cloudhost247-node/src/**'
      - 'cloudhost247-node/database/**'
      - 'cloudhost247-node/package.json'
      - 'docs/VPS_DEPLOYMENT.md'
      - '.github/workflows/vps-stack.yml'

jobs:
  validate:
    name: Validate VPS stack artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax for every script
        run: |
          set -euo pipefail
          for f in infrastructure/vps/setup-ubuntu-24.04.sh \
                   infrastructure/vps/scripts/*.sh \
                   infrastructure/vps/tests/*.sh \
                   cloudhost247-node/scripts/package-vps.sh; do
            bash -n "$f"
            echo "OK $f"
          done

      - name: ShellCheck at error severity
        # Warnings are advisory here; hard errors (unquoted expansions that break,
        # undefined commands, bad conditionals) must be fixed.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error \
            infrastructure/vps/setup-ubuntu-24.04.sh \
            infrastructure/vps/scripts/*.sh \
            infrastructure/vps/tests/*.sh \
            cloudhost247-node/scripts/package-vps.sh

      - name: Stack smoke test for files, placeholders, units and proxies
        run: bash infrastructure/vps/tests/smoke-test.sh

      - name: Healthcheck TLS classification test
        run: bash infrastructure/vps/tests/tls-check-test.sh

      - name: Provisioning script dry run with stubbed system commands
        run: bash infrastructure/vps/tests/setup-dry-run.sh

      - name: Provisioning gate rejects an unready host
        run: bash infrastructure/vps/tests/gate-test.sh

      - name: Nginx configuration test with real nginx
        # Proves `nginx -t` passes with the vhosts as shipped: placeholders are
        # rendered exactly like setup-ubuntu-24.04.sh does, and a throwaway
        # self-signed certificate is generated at the paths Certbot will later
        # use (the same bootstrap the setup script performs).
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx openssl

          sudo mkdir -p /etc/nginx/snippets /var/www/letsencrypt
          sudo cp infrastructure/vps/nginx/snippets/*.conf /etc/nginx/snippets/

          for d in cloudhost247.com app.cloudhost247.com; do
            sudo mkdir -p "/etc/letsencrypt/live/$d"
            sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -keyout "/etc/letsencrypt/live/$d/privkey.pem" \
              -out "/etc/letsencrypt/live/$d/fullchain.pem" \
              -subj "/CN=$d" >/dev/null 2>&1
            sudo cp "/etc/letsencrypt/live/$d/fullchain.pem" "/etc/letsencrypt/live/$d/chain.pem"
          done

          sudo mkdir -p /var/www/whmcs
          for vhost in cloudhost247-whmcs.conf cloudhost247-node.conf; do
            sudo sed -e "s|__DOMAIN__|cloudhost247.com|g" -e "s|__APP_DOMAIN__|app.cloudhost247.com|g" \
                     -e "s|__WHMCS_ROOT__|/var/www/whmcs|g" \
              "infrastructure/vps/nginx/$vhost" \
              | sudo tee "/etc/nginx/sites-enabled/$vhost" >/dev/null
          done
          sudo rm -f /etc/nginx/sites-enabled/default
          # A leftover placeholder would still parse in some positions; fail loudly.
          if sudo grep -rq '__[A-Z_]*__' /etc/nginx/sites-enabled/; then
            echo "Unrendered placeholder in a vhost:" >&2
            sudo grep -rn '__[A-Z_]*__' /etc/nginx/sites-enabled/ >&2
            exit 1
          fi
          sudo nginx -t

  deploy-path:
    name: Deploy produces a migrated schema and a running process
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudhost247-node/package-lock.json

      - name: Install and build the Node app the way deploy.sh does
        working-directory: cloudhost247-node
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy path test (migrations reach the DB, entrypoint boots)
        # Catches the class of failure that every artefact-level check missed:
        # a documented deploy that applies no migrations while all static
        # checks stay green.
        run: bash infrastructure/vps/tests/deploy-migrate-test.sh

  live-nginx:
    name: Live nginx behaviour (real responses, not just syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nginx, curl, openssl, python3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx curl openssl python3

      - name: Run the live integration test
        # Exercises the shipped vhosts against a running nginx: secret denies,
        # PHP source-disclosure regression, ACME reachability, pretty-URL and
        # /tools/ routing, single Cache-Control, header inheritance, proxy
        # headers, HTTP/2. This is the test that caught the ^~ /tools/ bug.
        run: |
          sudo env NGINX_BIN=/usr/sbin/nginx \
            bash infrastructure/vps/tests/nginx-live-test.sh

      - name: Upload nginx logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-logs
          path: /var/log/nginx/*.log
          if-no-files-found: ignore
